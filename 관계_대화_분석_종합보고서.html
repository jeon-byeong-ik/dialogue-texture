<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#172438">
  <title>종합보고서 인증 · 대화의 결</title>
  <style>
    :root{--ink:#172438;--muted:#718095;--paper:#f5f2eb;--coral:#ef765f;--gold:#e2b346;--teal:#2d8b82;--line:rgba(23,36,56,.14)}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;color:var(--ink);background:radial-gradient(circle at 12% 12%,rgba(239,118,95,.13),transparent 25rem),radial-gradient(circle at 88% 20%,rgba(45,139,130,.13),transparent 27rem),var(--paper);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}.page{width:min(calc(100% - 28px),1060px);display:grid;grid-template-columns:1.08fr .92fr;overflow:hidden;border:1px solid var(--line);border-radius:32px;background:rgba(255,253,248,.92);box-shadow:0 30px 90px rgba(23,36,56,.13)}.visual{position:relative;min-height:620px;padding:50px;overflow:hidden;color:white;background:#172438}.visual:after{content:"";position:absolute;inset:auto -120px -150px auto;width:410px;height:410px;border:1px solid rgba(255,255,255,.15);border-radius:50%;box-shadow:0 0 0 70px rgba(255,255,255,.025),0 0 0 140px rgba(255,255,255,.018)}.brand{display:flex;align-items:center;gap:12px;font-size:.77rem;font-weight:900;letter-spacing:.1em}.mark{position:relative;width:31px;height:31px}.mark i{position:absolute;width:9px;height:9px;border-radius:50%;animation:pulse 2.8s ease-in-out infinite}.mark i:nth-child(1){left:0;top:11px;background:var(--coral)}.mark i:nth-child(2){right:0;top:1px;background:var(--gold);animation-delay:-.9s}.mark i:nth-child(3){right:2px;bottom:1px;background:#67c7ba;animation-delay:-1.8s}.mark:before,.mark:after{content:"";position:absolute;left:6px;top:15px;width:25px;height:1px;background:rgba(255,255,255,.4);transform-origin:left}.mark:before{transform:rotate(-27deg)}.mark:after{transform:rotate(27deg)}.visual-copy{position:absolute;left:50px;right:50px;bottom:56px;z-index:1}.eyebrow{margin-bottom:16px;color:#9edbd4;font-size:.72rem;font-weight:900;letter-spacing:.13em}.visual h1{margin:0 0 20px;font-size:clamp(3rem,6vw,5.3rem);line-height:.98;letter-spacing:-.065em}.visual p{max-width:520px;margin:0;color:rgba(255,255,255,.67);font-size:.98rem;line-height:1.75}.auth{padding:50px 44px;display:flex;flex-direction:column;justify-content:center}.lock{width:54px;height:54px;display:grid;place-items:center;margin-bottom:30px;border-radius:18px;color:white;background:var(--teal);font-size:1.45rem}.auth h2{margin:0 0 12px;font-size:2rem;letter-spacing:-.04em}.auth>p{margin:0 0 28px;color:var(--muted);line-height:1.7}.field{display:grid;gap:9px}.field label{font-size:.78rem;font-weight:900}.input-wrap{display:flex;gap:8px;padding:7px;border:1px solid var(--line);border-radius:15px;background:white;transition:border-color .2s,box-shadow .2s}.input-wrap:focus-within{border-color:var(--teal);box-shadow:0 0 0 4px rgba(45,139,130,.1)}input{min-width:0;flex:1;padding:9px 11px;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:1.05rem;letter-spacing:.14em}button{min-width:96px;padding:10px 16px;border:0;border-radius:11px;color:white;background:var(--ink);font:inherit;font-size:.82rem;font-weight:900;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.error{min-height:24px;margin:10px 0 0;color:#c54f3e;font-size:.78rem;font-weight:700}.status{display:flex;align-items:center;gap:10px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:.73rem;line-height:1.55}.status i{width:8px;height:8px;flex:0 0 auto;border-radius:50%;background:var(--teal);box-shadow:0 0 0 5px rgba(45,139,130,.1)}.back{display:inline-block;margin-top:22px;color:var(--muted);font-size:.76rem;text-decoration:none}.back:hover{color:var(--ink)}@keyframes pulse{0%,100%{transform:scale(.8);opacity:.62}50%{transform:scale(1.15);opacity:1}}@media(max-width:760px){body{display:block;padding:14px}.page{grid-template-columns:1fr}.visual{min-height:280px;padding:28px}.visual-copy{left:28px;right:28px;bottom:30px}.visual h1{font-size:3rem}.visual p{display:none}.auth{padding:34px 26px 38px}.lock{margin-bottom:22px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="page">
    <section class="visual" aria-label="종합보고서 소개">
      <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>DIALOGUE TEXTURE</div>
      <div class="visual-copy"><div class="eyebrow">PROTECTED MAIN REPORT</div><h1>관계 대화 분석<br>종합보고서</h1><p>장기 대화에서 반복된 개인별 역할, 관계축, 말버릇, 갈등 가능성과 앞으로의 방향을 담은 보호된 보고서입니다.</p></div>
    </section>
    <section class="auth" aria-labelledby="auth-title">
      <div class="lock" aria-hidden="true">●</div>
      <h2 id="auth-title">비밀번호가 필요합니다</h2>
      <p>종합보고서 본문은 암호화되어 있습니다. 비밀번호가 일치하면 이 브라우저에서 내용을 복호화해 표시합니다.</p>
      <form id="unlock-form" class="field">
        <label for="password">REPORT PASSWORD</label>
        <div class="input-wrap"><input id="password" type="password" inputmode="numeric" autocomplete="current-password" aria-describedby="error" autofocus><button id="submit" type="submit">보고서 열기</button></div>
        <p id="error" class="error" role="alert" aria-live="polite"></p>
      </form>
      <div class="status"><i aria-hidden="true"></i><span>AES-GCM으로 암호화된 본문을 브라우저 안에서만 복호화합니다.</span></div>
      <a class="back" href="index.html">← 보고서 목록으로 돌아가기</a>
    </section>
  </main>
  <script>
    (()=>{
      const form=document.querySelector('#unlock-form');
      const input=document.querySelector('#password');
      const button=document.querySelector('#submit');
      const error=document.querySelector('#error');
      const cacheKey='dialogue-texture-main-key-v1';
      const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
      const toB64=bytes=>{let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
      let payloadPromise;
      const payload=()=>payloadPromise??=fetch('assets/main-report.enc.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('payload');return r.json()});
      async function keyFromPassword(password,data){
        const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
        return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:fromB64(data.salt),iterations:data.iterations},base,{name:'AES-GCM',length:256},true,['decrypt']);
      }
      async function decryptWithKey(key,data){
        const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(data.iv)},key,fromB64(data.ciphertext));
        return new TextDecoder().decode(plain);
      }
      function render(html){document.open();document.write(html);document.close()}
      async function unlock(password){
        const data=await payload();
        const key=await keyFromPassword(password,data);
        const html=await decryptWithKey(key,data);
        const raw=await crypto.subtle.exportKey('raw',key);
        sessionStorage.setItem(cacheKey,toB64(new Uint8Array(raw)));
        render(html);
      }
      async function unlockCached(){
        const saved=sessionStorage.getItem(cacheKey);if(!saved)return;
        try{const data=await payload();const key=await crypto.subtle.importKey('raw',fromB64(saved),{name:'AES-GCM'},false,['decrypt']);render(await decryptWithKey(key,data))}catch{sessionStorage.removeItem(cacheKey)}
      }
      form.addEventListener('submit',async e=>{
        e.preventDefault();error.textContent='';button.disabled=true;button.textContent='확인 중…';
        try{await unlock(input.value)}catch{error.textContent='비밀번호가 일치하지 않습니다.';input.select();button.disabled=false;button.textContent='보고서 열기'}
      });
      unlockCached();
    })();
  </script>
</body>
</html>
