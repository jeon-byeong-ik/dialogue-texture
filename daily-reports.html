<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#172438">
  <title>일일보고서 목록 인증 · 대화의 결</title>
  <link rel="stylesheet" href="assets/report-gate.css">
</head>
<body data-payload="assets/daily-reports.enc.json" data-cache-key="dialogue-texture-daily-reports-key-v1">
  <main class="page">
    <section class="visual" aria-label="일일보고서 보관함 소개">
      <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>DIALOGUE TEXTURE</div>
      <div class="visual-copy"><div class="eyebrow">PROTECTED DAILY ARCHIVE · 2026.08</div><h1>지난 일일보고서<br>목록</h1><p>날짜별 대화 흐름과 그날 새롭게 확인된 관계 신호를 모아둔 보호된 보관함입니다.</p></div>
    </section>
    <section class="auth" aria-labelledby="auth-title">
      <div class="lock" aria-hidden="true">●</div>
      <h2 id="auth-title">비밀번호가 필요합니다</h2>
      <p>날짜별 보고서 목록은 암호화되어 있습니다. 비밀번호가 일치하면 이 브라우저에서 목록을 복호화해 표시합니다.</p>
      <form id="unlock-form" class="field">
        <label for="password">REPORT PASSWORD</label>
        <div class="input-wrap"><input id="password" type="password" inputmode="numeric" autocomplete="current-password" aria-describedby="error" autofocus><button id="submit" type="submit">목록 열기</button></div>
        <p id="error" class="error" role="alert" aria-live="polite"></p>
      </form>
      <div class="status"><i aria-hidden="true"></i><span>AES-GCM으로 암호화된 목록을 브라우저 안에서만 복호화합니다.</span></div>
      <a class="back" href="index.html">← 메인으로 돌아가기</a>
    </section>
  </main>
  <script src="assets/report-gate.js"></script>
</body>
</html>
